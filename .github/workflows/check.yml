name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: git diff --exit-code -- md2word.html cli/md2word.mjs downloads/lighter-md-to-word-cli.zip THIRD_PARTY_LICENSES.txt examples/profiles.example.json
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
